<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Is Curiosity Worth the Cost? — Vote</title>
<style>
  :root{--bg1:#07374a;--bg2:#032330;--card:#0c4a5e;--edge:#2a7286;--ink:#ecfbf8;
        --soft:#8fc9c9;--coral:#ff7f5c;--turq:#38d3bc;--gold:#ffd166}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;background:linear-gradient(180deg,var(--bg1),var(--bg2));
       color:var(--ink);font-family:'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif;
       display:flex;flex-direction:column;align-items:center;padding:18px 14px 40px}
  .top{width:100%;max-width:560px;text-align:center;margin-bottom:14px}
  .top h1{font-size:19px;letter-spacing:.06em}
  .top .ph{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--turq);margin-top:4px}
  .wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px}
  .note{color:var(--soft);text-align:center;font-size:15px;line-height:1.55;padding:10px}
  .role{border:2px solid var(--turq);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5;
        background:rgba(56,211,188,.07)}
  .role.investor{border-color:var(--gold);background:rgba(255,209,102,.07)}
  .role b.inv{color:var(--gold)} .role b.nsf{color:var(--turq)}
  .opt{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--edge);
       border-radius:12px;padding:13px 14px;cursor:pointer;user-select:none;transition:all .12s}
  .opt .oi{flex:0 0 32px;width:32px;height:32px}
  .opt .oi svg{width:100%;height:100%;fill:none}
  .ic-main{stroke:var(--turq)} .ic-acc{stroke:var(--coral)}
  .opt .t{flex:1;font-size:16.5px;font-weight:600}
  .opt .y{font-size:12px;color:var(--soft);letter-spacing:.15em}
  .opt.sel{border-color:var(--gold);background:rgba(255,209,102,.10)}
  .opt.sel .t{color:var(--gold)}
  .opt.dis{opacity:.45}
  button.go{margin-top:8px;padding:15px;border-radius:12px;font-size:16px;font-weight:700;
     letter-spacing:.1em;text-transform:uppercase;border:none;cursor:pointer;
     background:var(--coral);color:#28120a}
  button.go:disabled{opacity:.35}
  .done{ text-align:center;padding:26px 10px;font-size:18px;line-height:1.6}
  .done b{color:var(--turq)}
  .pay{background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:13px 14px;margin-bottom:8px}
  .pay .h{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft)}
  .pay .n{font-size:16.5px;font-weight:700;margin:3px 0}
  .pay .big{font-size:24px;font-weight:800;letter-spacing:.02em;margin:2px 0}
  .pay.win .big{color:var(--turq)} .pay.zero .big{color:var(--coral)}
  .pay .v{font-size:14.5px;line-height:1.45;color:var(--soft)}
  .pay .room{font-size:12.5px;letter-spacing:.03em;margin-top:6px;padding-top:6px;
             border-top:1px solid rgba(143,201,201,.25);color:var(--soft)}
  .pay .room.sting{color:var(--gold);font-weight:600}
  .foot{margin-top:auto;padding-top:18px;font-size:11px;color:rgba(236,251,248,.4);
        letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="top">
    <h1>Is Curiosity Worth the Cost?</h1>
    <div class="ph" id="phaseLabel">connecting…</div>
  </div>
  <div class="wrap" id="wrap"><div class="note">Connecting to the room…</div></div>
  <div class="foot">Scientifica 2026 · anonymous vote</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ====== CONFIG — paste from Supabase project settings ====== */
const SUPABASE_URL = "https://gwpawtexcwhtavdxakvm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ONj8MatQbh6voeMCTXM1fQ_L16PJSSm";
/* =========================================================== */

const ICONS = {

 jelly:`<svg viewBox="0 0 100 100"><path d="M28 52 a22 22 0 0 1 44 0 z" fill="none" class="ic-main" stroke-width="3" stroke-linejoin="round"/><path d="M25 47 a25 18 0 0 1 50 0" fill="none" class="ic-acc" stroke-width="2.8" stroke-dasharray="4 4"/><g class="ic-main" stroke-width="2.4" stroke-linecap="round" fill="none"><path d="M34 54 q-2 12 3 22"/><path d="M44 54 q-1 14 -4 26"/><path d="M56 54 q1 14 4 26"/><path d="M66 54 q2 12 -3 22"/></g></svg>`,
 spring:`<svg viewBox="0 0 100 100"><path d="M20 74 q15 -8 30 0 t30 0" fill="none" class="ic-main" stroke-width="3" stroke-linecap="round"/><path d="M24 84 q13 -6 26 0 t26 0" fill="none" class="ic-main" stroke-width="2.2" stroke-linecap="round" opacity=".6"/><g class="ic-acc" stroke-width="2.6" stroke-linecap="round" fill="none"><path d="M35 58 q-5 -8 0 -16 q5 -8 0 -14"/><path d="M50 60 q-5 -8 0 -16 q5 -8 0 -14"/><path d="M65 58 q-5 -8 0 -16 q5 -8 0 -14"/></g></svg>`,
 poly:`<svg viewBox="0 0 100 100"><path d="M42 16 h16 M46 16 v26 l-14 30 a8 8 0 0 0 7 12 h22 a8 8 0 0 0 7 -12 l-14 -30 v-26" fill="none" class="ic-main" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 64 h24" class="ic-acc" stroke-width="2.8" stroke-linecap="round"/><path d="M50 38 q6 4 0 9 q-6 4 0 9" fill="none" class="ic-acc" stroke-width="2.4" stroke-linecap="round"/></svg>`,
 clocks:`<svg viewBox="0 0 100 100"><circle cx="42" cy="52" r="20" fill="none" class="ic-main" stroke-width="3"/><line x1="42" y1="52" x2="42" y2="40" class="ic-main" stroke-width="2.8" stroke-linecap="round"/><line x1="42" y1="52" x2="51" y2="56" class="ic-main" stroke-width="2.8" stroke-linecap="round"/><g class="ic-acc" stroke-width="2.6" stroke-linecap="round" fill="none"><path d="M64 30 l16 -8 l-4 10 z" stroke-linejoin="round"/><path d="M60 76 q14 2 24 -6" stroke-dasharray="3 4"/></g></svg>`,
 stm:`<svg viewBox="0 0 100 100"><path d="M50 14 L58 34 L54 46 L50 56 L46 46 L42 34 Z" fill="none" class="ic-acc" stroke-width="2.8" stroke-linejoin="round"/><g class="ic-main" fill="none" stroke-width="2.6"><circle cx="26" cy="74" r="8"/><circle cx="50" cy="74" r="8"/><circle cx="74" cy="74" r="8"/></g><path d="M44 62 q6 -6 12 0" fill="none" class="ic-acc" stroke-width="2" stroke-dasharray="2 3"/></svg>`,
 crispr:`<svg viewBox="0 0 100 100"><path d="M30 16 q40 17 0 34 q40 17 0 34" fill="none" class="ic-main" stroke-width="3" stroke-linecap="round"/><path d="M70 16 q-40 17 0 34 q-40 17 0 34" fill="none" class="ic-main" stroke-width="3" stroke-linecap="round"/><g class="ic-acc" stroke-width="2.6" stroke-linecap="round"><line x1="38" y1="24" x2="62" y2="24"/><line x1="38" y1="50" x2="62" y2="50"/><line x1="38" y1="76" x2="62" y2="76"/></g></svg>`,
 mrna:`<svg viewBox="0 0 100 100"><path d="M14 60 q12 -18 24 0 t24 0 t24 0" fill="none" class="ic-main" stroke-width="3" stroke-linecap="round"/><g class="ic-acc" stroke-width="2.4" stroke-linecap="round"><line x1="26" y1="52" x2="26" y2="40"/><line x1="50" y1="52" x2="50" y2="40"/><line x1="74" y1="52" x2="74" y2="40"/></g><rect x="30" y="18" width="40" height="16" rx="4" fill="none" class="ic-acc" stroke-width="2.4"/><path d="M30 20 l20 10 l20 -10" fill="none" class="ic-acc" stroke-width="2"/></svg>`,
 arsenic:`<svg viewBox="0 0 100 100"><path d="M20 72 q15 -8 30 0 t30 0" fill="none" class="ic-main" stroke-width="3" stroke-linecap="round"/><ellipse cx="50" cy="46" rx="16" ry="10" fill="none" class="ic-main" stroke-width="3"/><g class="ic-main" stroke-width="2.2" stroke-linecap="round"><line x1="34" y1="46" x2="26" y2="42"/><line x1="66" y1="46" x2="74" y2="42"/><line x1="44" y1="55" x2="40" y2="62"/><line x1="56" y1="55" x2="60" y2="62"/></g><path d="M50 14 l8 12 h-16 z" fill="none" class="ic-acc" stroke-width="2.6" stroke-linejoin="round"/></svg>`,
 brain:`<svg viewBox="0 0 100 100"><rect x="18" y="22" width="64" height="52" rx="6" fill="none" class="ic-main" stroke-width="3"/><path d="M40 60 q-8 -4 -6 -12 q-6 -4 0 -10 q0 -8 8 -8 q4 -6 10 -2 q8 -2 8 6 q8 2 4 10 q4 8 -4 10 q0 8 -10 6 q-6 4 -10 0" fill="none" class="ic-acc" stroke-width="2.6" stroke-linejoin="round"/><g class="ic-main" stroke-width="2.4" stroke-linecap="round"><line x1="30" y1="82" x2="30" y2="74"/><line x1="50" y1="82" x2="50" y2="74"/><line x1="70" y1="82" x2="70" y2="74"/></g></svg>`,
 leaf:`<svg viewBox="0 0 100 100"><path d="M50 82 q-28 -8 -24 -36 q26 -6 40 8 q10 12 -16 28" fill="none" class="ic-main" stroke-width="3" stroke-linejoin="round"/><path d="M38 72 q10 -14 26 -22" fill="none" class="ic-main" stroke-width="2.2" stroke-linecap="round"/><circle cx="72" cy="26" r="9" fill="none" class="ic-acc" stroke-width="2.8"/><g class="ic-acc" stroke-width="2.2" stroke-linecap="round"><line x1="72" y1="10" x2="72" y2="15"/><line x1="72" y1="37" x2="72" y2="42"/><line x1="56" y1="26" x2="61" y2="26"/><line x1="83" y1="26" x2="88" y2="26"/></g></svg>`
};

const R1=[
 {id:"vulcan", t:"The planet that must exist", y:"1860"},
 {id:"laser",  t:"An echo of light", y:"1959"},
 {id:"jelly",  t:"Why does the jellyfish glow?", y:"1961"},
 {id:"spring", t:"Life in boiling water", y:"1966"},
 {id:"poly",   t:"A second kind of water", y:"1966"},
 {id:"clocks", t:"Do flying clocks lie?", y:"1971"}];
const R2=[
 {id:"stm",    t:"Feeling atoms with a needle", y:"1979"},
 {id:"crispr", t:"A drumbeat in the DNA", y:"1995"},
 {id:"mrna",   t:"Cells that brew their own medicine", y:"1995"},
 {id:"arsenic",t:"Life that runs on poison", y:"2009"},
 {id:"brain",  t:"The brain in a computer", y:"2013"},
 {id:"leaf",   t:"The artificial leaf", y:"2015"}];
const SURVEY=[
 {id:"b0", t:"0 – 20 %"},{id:"b20", t:"20 – 40 %"},{id:"b40", t:"40 – 60 %"},
 {id:"b60", t:"60 – 80 %"},{id:"b80", t:"80 – 100 %"}];
const OUTCOME={
 vulcan:{val:"CHF 0",           v:"Phantom planet — but its mystery became Einstein's relativity.",win:false},
 laser: {val:"> $1 trillion",   v:"The laser. Devices ~$25 bn/yr — laser-enabled industries beyond that.",win:true},
 jelly: {val:"~$3 bn / yr",     v:"The glowing protein lighting up modern biology.",win:true},
 spring:{val:"$15–30 bn / yr",  v:"The enzyme behind every DNA test on Earth.",win:true},
 poly:  {val:"CHF 0",           v:"Contamination — an honest dead end.",win:false},
 clocks:{val:"~$1.4 trillion",  v:"GPS. Relativity, in your pocket.",win:true},
 stm:   {val:"$600 bn / yr",    v:"Nanoscience — the measuring stick under the chip industry.",win:true},
 crispr:{val:"$5–6 bn / yr",    v:"CRISPR gene editing — first cures approved, and growing.",win:true},
 mrna:  {val:"> $100 bn",       v:"The mRNA vaccines.",win:true},
 arsenic:{val:"CHF 0",          v:"Contamination + hype; retracted after 15 years.",win:false},
 brain: {val:"− €1 bn",         v:"A billion spent; the promised simulated brain never arrived.",win:false},
 leaf:  {val:"$0 — so far",     v:"Fifty years of honest work; the moonshot continues.",win:false}};

const PHASES={
 waiting:{label:"waiting for the game to start"},
 r1inv:{label:"Round 1 · vote as INVESTOR", items:R1, k:2, role:"investor",
        text:"You are an <b class='inv'>investor</b>. One goal: <b class='inv'>maximum profit</b>. Fund <b>2</b> projects."},
 r1nsf:{label:"Round 1 · vote as SCIENCE FOUNDATION", items:R1, k:2, role:"nsf",
        text:"You are the <b class='nsf'>national science foundation</b>: sound knowledge for society, short and long run. Fund <b>2</b>."},
 r2inv:{label:"Round 2 · vote as INVESTOR", items:R2, k:2, role:"investor",
        text:"Investor again — <b class='inv'>profit</b>. Fund <b>2</b>."},
 r2nsf:{label:"Round 2 · vote as SCIENCE FOUNDATION", items:R2, k:2, role:"nsf",
        text:"The <b class='nsf'>foundation</b> again — the public mission. Fund <b>2</b>."},
 survey:{label:"Final question", items:SURVEY, k:1, role:"nsf",
        text:"How much of public research funding should go to <b class='nsf'>curiosity-driven</b> research?"},
 closed:{label:"voting closed"},
 payout:{label:"Your portfolio"},
 done:{label:"thank you!"}};

let sb=null, voterId=null, current=null;
function boot(){
  try{ voterId=localStorage.getItem('voterId');
       if(!voterId){ voterId=crypto.randomUUID(); localStorage.setItem('voterId',voterId);} }
  catch(e){ voterId=crypto.randomUUID(); }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  sb.channel('state').on('postgres_changes',
    {event:'*',schema:'public',table:'app_state'},
    p=>render(p.new)).subscribe();
  sb.from('app_state').select('*').eq('id',1).single()
    .then(({data,error})=>{ if(data) render(data);
      else document.getElementById('wrap').innerHTML=
        '<div class="note">Could not reach the room — check the config keys.</div>'; });
  setInterval(async()=>{ const {data}=await sb.from('app_state').select('*').eq('id',1).single();
                         if(data && (!current||data.phase!==current.phase||data.game!==current.game)) render(data); },5000);
}
/* picks are namespaced by the game counter: presenter_reset bumps app_state.game,
   so every phone automatically forgets its old ballot and can vote again */
function pickKey(state,phase){ return 'pick_g'+(state&&state.game||1)+'_'+phase; }
function myPick(state,phase){ try{return JSON.parse(localStorage.getItem(pickKey(state,phase))||'null')}catch(e){return null} }
function savePick(state,phase,v){ try{localStorage.setItem(pickKey(state,phase),JSON.stringify(v))}catch(e){} }

function render(state){
  current=state;
  const cfg=PHASES[state.phase]||PHASES.waiting;
  document.getElementById('phaseLabel').textContent=cfg.label;
  const wrap=document.getElementById('wrap');
  if(state.phase==='waiting'){ wrap.innerHTML='<div class="note">Welcome! Keep this page open — voting starts soon.</div>'; return; }
  if(state.phase==='done'){ wrap.innerHTML='<div class="note">Thank you for playing the committee. Enjoy the rest of the talk!</div>'; return; }
  if(state.phase==='closed'){ wrap.innerHTML='<div class="note">Voting is closed — watch the big screen.</div>'; return; }
  if(state.phase==='payout'){ renderPayout(state); return; }
  if(!cfg.items) return;

  const already=myPick(state,state.phase);
  if(already){ wrap.innerHTML=`<div class="done">Vote received ✓<br><b>${already.map(id=>[...R1,...R2,...SURVEY].find(c=>c.id===id).t).join('</b> · <b>')}</b><br><span style="color:var(--soft);font-size:14px">Watch the big screen.</span></div>`; return; }

  let sel=[];
  wrap.innerHTML='';
  const role=document.createElement('div');
  role.className='role'+(cfg.role==='investor'?' investor':'');
  role.innerHTML=cfg.text; wrap.appendChild(role);
  cfg.items.forEach(c=>{
    const d=document.createElement('div'); d.className='opt';
    const oi=ICONS[c.id]?`<span class="oi">${ICONS[c.id]}</span>`:'';
    d.innerHTML=`${oi}<span class="t">${c.t}</span>${c.y?`<span class="y">${c.y}</span>`:''}`;
    d.onclick=()=>{
      if(sel.includes(c.id)) sel=sel.filter(x=>x!==c.id);
      else if(sel.length<cfg.k) sel.push(c.id);
      [...wrap.querySelectorAll('.opt')].forEach((el,i)=>{
        const id=cfg.items[i].id;
        el.classList.toggle('sel',sel.includes(id));
        el.classList.toggle('dis',!sel.includes(id)&&sel.length>=cfg.k);
      });
      btn.disabled=(sel.length!==cfg.k);
      btn.textContent=(sel.length===cfg.k)?'Cast my vote':`Pick ${cfg.k-sel.length} more`;
    };
    wrap.appendChild(d);
  });
  const btn=document.createElement('button');
  btn.className='go'; btn.disabled=true; btn.textContent=`Pick ${cfg.k}`;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent='Sending…';
    /* insert first; on duplicate (re-vote) fall back to update.
       No upsert: ON CONFLICT needs a SELECT policy, and phones may not read ballots. */
    let {error}=await sb.from('votes').insert(
      {voter_id:voterId, phase:current.phase, choices:sel});
    if(error && error.code==='23505'){
      ({error}=await sb.from('votes').update({choices:sel})
        .eq('voter_id',voterId).eq('phase',current.phase));
    }
    if(error){ btn.textContent='Failed — tap to retry'; btn.disabled=false; return; }
    savePick(current,current.phase,sel); render(current);
  };
  wrap.appendChild(btn);
}

function renderPayout(state){
  const wrap=document.getElementById('wrap');
  const picks=(myPick(state,'r1inv')||[]).concat(myPick(state,'r2inv')||[]);
  if(!picks.length){ wrap.innerHTML='<div class="note">No investor picks stored on this phone — watch the big screen for the reveal.</div>'; return; }
  const built=(state.funded_r1||[]).concat(state.funded_r2||[]);
  let html='<div class="note">Your investor picks — what history did with them, and what this room did:</div>';
  let wins=0;
  picks.forEach(id=>{
    const c=[...R1,...R2].find(x=>x.id===id); const o=OUTCOME[id]; if(!c||!o) return;
    if(o.win) wins++;
    const rf=built.includes(id);
    const flag=o.win
      ? (rf?'✓ this room funded it too':'✗ paid off in reality — but this room rejected it')
      : (rf?'this room funded it — history returned zero':'this room passed on it — history agreed');
    html+=`<div class="pay ${o.win?'win':'zero'}">
      <div class="h">your pick · ${c.y}</div>
      <div class="n">${c.t}</div>
      <div class="big">${o.val}</div>
      <div class="v">${o.v}</div>
      <div class="room ${o.win&&!rf?'sting':''}">${flag}</div></div>`;
  });
  html+=`<div class="done">${wins===picks.length?'A golden portfolio — every pick paid off.':
        wins===0?'Every pick returned zero — welcome to research funding.':
        `<b>${wins}</b> of ${picks.length} picks paid off — nobody can pick only winners.`}</div>`;
  wrap.innerHTML=html;
}
boot();
</script>
</body>
</html>
